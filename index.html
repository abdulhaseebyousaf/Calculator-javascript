<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

</head>

<body class="min-h-screen font-[Rubik] px-4 text-teal-700 bg-gradient-to-r from-[#355269] via-[#9bbdb1] to-[#609faf] flex items-center justify-center">
       <div class="bg-black opacity-90 p-3 rounded-sm">  
        <input class="input w-full p-3 mb-4  bg-slate-900 text-right text-2xl border border-gray-300 rounded-md" type="text" > </input>
           <div class="grid  grid-cols-4  text-teal-700  gap-2"> 
        
            <button class="button active:scale-[0.98] p-3 bg-red-500 cursor-pointer text-white rounded-md">C</button>   
            <button class="button active:scale-[0.98] p-3 bg-red-500 text-white cursor-pointer rounded-md">DEL</button>       
               <button class="button p-3 active:scale-[0.98] bg-orange-500 text-white cursor-pointer rounded-md">%</button> 
                 
               <button class="button  p-3 active:scale-[0.98] bg-orange-500 text-white cursor-pointer rounded-md">/</button>      
               
               <button class="button active:scale-[0.98] p-3 bg-gray-300 cursor-pointer rounded-md">7</button>
               <button class="button active:scale-[0.98] p-3 bg-gray-300 cursor-pointer rounded-md">8</button>
               <button class="button active:scale-[0.98] p-3 bg-gray-300 cursor-pointer rounded-md">9</button>
               <button class="button active:scale-[0.98] p-3 bg-orange-500 cursor-pointer text-white rounded-md">*</button>
            <button class="button active:scale-[0.98] p-3 bg-gray-300 cursor-pointer rounded-md">4</button>
            <button class="button active:scale-[0.98] p-3 bg-gray-300 cursor-pointer rounded-md">5</button>
            <button class="button active:scale-[0.98] p-3 bg-gray-300 cursor-pointer rounded-md">6</button>
            <button class="button active:scale-[0.98] p-3 bg-orange-500 cursor-pointer text-white rounded-md">-</button>
            <button class="button active:scale-[0.98] p-3 bg-gray-300 cursor-pointer rounded-md">1</button>
            <button class="button active:scale-[0.98] p-3 bg-gray-300 cursor-pointer rounded-md">2</button>
            <button class="button active:scale-[0.98] p-3 bg-gray-300 cursor-pointer rounded-md">3</button>
            <button class="button active:scale-[0.98] p-3 bg-orange-500 cursor-pointer text-white rounded-md">+</button>
            
            <button class="button active:scale-[0.98] p-3 bg-gray-300 rounded-md cursor-pointer col-span-2">0</button>
            <button class="button p-3 active:scale-[0.98] bg-gray-300 cursor-pointer rounded-md">.</button>
            <button class="button p-3 active:scale-[0.98] bg-orange-500 cursor-pointer text-white rounded-md ">=</button>
        </div>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
